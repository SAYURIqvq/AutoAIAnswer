name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build Windows exe
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AutoAIAnswer ^
            --icon assets\\app.ico ^
            --add-data "ai_screenshot_assistant\web\static;ai_screenshot_assistant\web\static" ^
            --add-data "assets;assets" ^
            --exclude-module IPython ^
            --exclude-module pytest ^
            --exclude-module matplotlib ^
            --exclude-module pandas ^
            --exclude-module pyarrow ^
            --exclude-module scipy ^
            --exclude-module sklearn ^
            --exclude-module torch ^
            --exclude-module torchvision ^
            --exclude-module torchaudio ^
            --exclude-module transformers ^
            --exclude-module datasets ^
            --exclude-module gradio ^
            --exclude-module cv2 ^
            --exclude-module tkinter ^
            main.py

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item dist/AutoAIAnswer.exe dist/package/AutoAIAnswer.exe
          Copy-Item README.md dist/package/README.md
          Compress-Archive -Path dist/package/* -DestinationPath dist/AutoAIAnswer-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoAIAnswer-Windows
          path: dist/AutoAIAnswer-Windows.zip
          if-no-files-found: error

      - name: Create tagged release if needed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:GITHUB_REF_NAME" `
            || gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" --notes "Automated Windows build."

      - name: Attach zip to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:GITHUB_REF_NAME" dist/AutoAIAnswer-Windows.zip --clobber
