name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build Windows exe
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AI_Assistant ^
            --add-data "ai_screenshot_assistant\web\static;ai_screenshot_assistant\web\static" ^
            --exclude-module IPython ^
            --exclude-module pytest ^
            --exclude-module matplotlib ^
            --exclude-module pandas ^
            --exclude-module pyarrow ^
            --exclude-module scipy ^
            --exclude-module sklearn ^
            --exclude-module torch ^
            --exclude-module torchvision ^
            --exclude-module torchaudio ^
            --exclude-module transformers ^
            --exclude-module datasets ^
            --exclude-module gradio ^
            --exclude-module cv2 ^
            --exclude-module tkinter ^
            main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Assistant-windows
          path: dist/AI_Assistant.exe
          if-no-files-found: error

      - name: Attach exe to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" dist/AI_Assistant.exe --clobber
