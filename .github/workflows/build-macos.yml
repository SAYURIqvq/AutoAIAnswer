name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node for mobile script tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test mobile speech and shared state
        run: node --test tests/mobile_browser.test.cjs

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build app bundle and DMG
        run: bash packaging/macos/package.sh

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQMusic-macOS.dmg
          path: dist/QQMusic-macOS.dmg
          if-no-files-found: error

      - name: Create tagged release if needed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft --notes-file RELEASE-v0.2.54.md \
            || gh release view "$GITHUB_REF_NAME"

      - name: Attach DMG to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/QQMusic-macOS.dmg --clobber
