name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --timeout=20

      - name: Build app bundle and DMG
        run: bash packaging/macos/package.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQMusic-macOS
          path: dist/QQMusic-macOS.dmg
          if-no-files-found: error

      - name: Attach DMG to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Automated macOS build." \
            || true
          gh release upload "$GITHUB_REF_NAME" dist/QQMusic-macOS.dmg --clobber
