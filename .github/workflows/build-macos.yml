name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build app bundle and DMG
        run: bash packaging/macos/package.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoAIAnswer-macOS
          path: dist/AutoAIAnswer-macOS.dmg
          if-no-files-found: error

      - name: Attach DMG to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/AutoAIAnswer-macOS.dmg --clobber
