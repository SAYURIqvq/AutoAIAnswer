<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 搜题助手</title>
    <link rel="stylesheet" href="/static/style.css?v=0.2.54" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>AI 搜题助手</h1>
        <span class="status" id="status">连接中</span>
      </header>
      <div class="model-routes">
        <label class="model-label" for="model-route">模型</label>
        <select id="model-route" aria-label="选择路线和模型">
          <option value="doubao-seed-2-0-mini">豆包 Mini · doubao-seed-2-0-mini-260428（最快 / 准确一般）</option>
          <option value="doubao-seed-2-0-lite">豆包 Lite · doubao-seed-2-0-lite-260428（较快 / 准确中等）</option>
          <option value="doubao-seed-2-1-turbo">豆包 Turbo · doubao-seed-2-1-turbo-260628（快 / 准确较好）</option>
          <option value="doubao-seed-2-1-pro">豆包 Pro · doubao-seed-2-1-pro-260915（最准 / 较慢）</option>
          <option value="qwen-vl-plus">通义千问 · qwen3-vl-plus（视觉增强）</option>
          <option value="qwen-vl-flash">通义千问 · qwen3.8-flash（视觉快速）</option>
          <option value="qwen-122b">通义千问 · qwen3.5-122b-a10b（122B 图文理解）</option>
          <option value="qwen-plus">通义千问 · qwen3.5-plus（长上下文图文理解）</option>
          <option value="qwen-397b">通义千问 · qwen3.5-397b-a17b（397B 图文理解）</option>
          <option value="qwen-27b">通义千问 · qwen3.5-27b（27B 图文理解）</option>
          <option value="qwen-35b">通义千问 · qwen3.5-35b-a3b（35B 图文理解）</option>
          <option value="qwen-flash">通义千问 · qwen3.5-flash（快速图文理解）</option>
          <option value="deepseek-flash">DeepSeek 官方 · deepseek-flash（快 / 准确一般）</option>
        </select>
      </div>
      <p class="model-hint" id="model-hint">通义千问 / qwen3-vl-plus</p>
      <div class="voice-mode">
        <label><input id="auto-read" type="checkbox" /> 手机端发声（自动朗读答案）</label>
        <button id="voice-preview" type="button">试听</button>
        <span id="voice-status" aria-live="polite"></span>
      </div>
      <div class="selection-status waiting" id="selection-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="selection-message">左键长按 2 秒框选，或右键长按 2 秒全屏</span>
      </div>
      <button class="capture-button" id="fullscreen-button" type="button" disabled>截全屏</button>
      <div class="output" id="output">等待电脑端发送题目…</div>
      <button class="clear-chat" id="copy-direct" type="button">复制答案</button>
      <button class="clear-chat" id="clear-direct" type="button">清空内容</button>
      <section class="chatbot" aria-label="截图对话">
        <div class="chat-header">
          <span>截图对话</span>
          <button class="clear-chat" id="clear-chat-button" type="button">清空聊天</button>
        </div>
        <div class="chat-list" id="chat-list" aria-live="polite">
          <div class="empty-chat">可以只截图不输入文字；多张截图会和可选文字一起发送给 AI。</div>
        </div>
        <div class="preview-panel" id="preview-panel" aria-live="polite">
          <div class="preview-toolbar">
            <div class="preview-count" id="preview-count">已截图：0张</div>
            <div class="preview-actions">
              <button class="save-album ghost" id="select-all-album" type="button">全选</button>
              <button class="save-album" id="save-album-button" type="button" disabled>保存到相册</button>
            </div>
          </div>
          <div class="preview-list" id="preview-list"></div>
        </div>
        <textarea
          id="question-input"
          rows="3"
          placeholder="输入细节问题或追问"
        ></textarea>
        <div class="chat-actions">
          <button class="capture-button compact" id="chat-capture-button" type="button" disabled>截全屏</button>
          <button class="capture-button secondary" id="ask-button" type="button" disabled>发送</button>
        </div>
      </section>
    </main>
    <div class="album-sheet" id="album-sheet" hidden>
      <div class="album-sheet-card">
        <p>长按图片，选择「添加到照片 / 存储图像」，不要选存储到文件。</p>
        <div class="album-sheet-images" id="album-sheet-images"></div>
        <button class="save-album" id="album-sheet-close" type="button">完成</button>
      </div>
    </div>
    <script>window.SESSION_ID = "__SESSION_ID__";</script>
    <script src="/static/app.js?v=0.2.54"></script>
  </body>
</html>
